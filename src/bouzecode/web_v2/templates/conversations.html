{% extends "base.html" %}
{% block content %}
<style>
  main { max-width: none; margin: 0; padding: 0; }
  /* Barre de prompt "nouvelle conversation" façon Claude/ChatGPT : un champ + une
     flèche d'envoi, en tête du panneau droit. Envoie sur /api/dispatch. */
  .conv-new-bar { display: flex; flex-direction: row; align-items: flex-end; gap: 8px;
    width: 100%; padding: 10px 12px; border-bottom: 1px solid var(--border);
    background: var(--panel2); }

  .conv-new-input { flex: 1; resize: none; min-height: 24px; max-height: 200px;
    padding: 9px 12px; border: 1px solid var(--border); border-radius: 20px;
    background: var(--panel2); color: var(--text); font: inherit; line-height: 1.4; }
  .conv-new-input:focus { outline: none; border-color: var(--accent); }
  .conv-new-send { flex: 0 0 auto; width: 38px; height: 38px; border: none;
    border-radius: 50%; background: var(--accent); color: var(--on-accent); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .conv-new-send:disabled { opacity: .5; cursor: default; }
  .conv-new-send svg { width: 18px; height: 18px; }
  .conv-new-error { color: var(--red); font-size: 12px; padding: 0 14px; min-height: 0; }
  .conv-new-error:not(:empty) { padding: 6px 14px; }
  /* Bannière d'options togglée (type d'agent) sous la barre "nouvelle conversation". */
  .conv-agent-bar { border-bottom: 1px solid var(--border); background: var(--panel); }
  .conv-agent-toggle { display: flex; align-items: center; gap: 6px; width: 100%;
    padding: 7px 14px; border: none; background: none; color: var(--text);
    font: inherit; font-size: 13px; cursor: pointer; text-align: left; }
  .conv-agent-toggle:hover { background: var(--bg); }
  .conv-agent-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .conv-agent-caret { display: inline-block; transition: transform .15s ease;
    color: var(--muted, #888); font-size: 10px; }
  .conv-agent-toggle[aria-expanded="true"] .conv-agent-caret { transform: rotate(90deg); }
  .conv-agent-toggle-label { color: var(--muted, #888); }
  .conv-agent-toggle-value { color: var(--text); font-weight: 600; }
  .conv-agent-panel { display: flex; flex-direction: column; gap: 2px;
    padding: 4px 8px 10px 8px; }
  .conv-agent-panel[hidden] { display: none; }
  .conv-agent-option { display: flex; align-items: flex-start; gap: 8px;
    padding: 7px 8px; border-radius: 8px; cursor: pointer; }
  .conv-agent-option:hover { background: var(--bg); }
  .conv-agent-option input { margin: 2px 0 0 0; flex: 0 0 auto; accent-color: var(--accent); }
  .conv-agent-option-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .conv-agent-option-name { font-size: 13px; color: var(--text); font-weight: 500; }
  .conv-agent-option-desc { font-size: 11px; color: var(--muted, #888);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* La barre de lancement (composer + type d'agent + projet) reste TOUJOURS
     ouverte, même quand des onglets de conversation sont ouverts : on doit
     pouvoir lancer un nouvel agent à tout moment (choix typologie + projet). */
</style>
<div class="conv-layout">
  <aside class="conv-sidebar">
    <h2>Conversations</h2>
    <div id="conv-list" class="conv-list">
      <p class="muted">Chargement…</p>
    </div>
  </aside>
  <section class="conv-main">
    <form id="conv-new-bar" class="conv-new-bar pui-promptbox">
      <textarea id="conv-new-input" name="conv-new-input" class="conv-new-input pui-promptbox__textarea" rows="1"
        placeholder="Nouvelle conversation — décris ce qu'il faut faire (Entrée pour envoyer)…"></textarea>
      <button id="conv-new-send" class="conv-new-send pui-promptbox__iconbtn" type="submit" title="Envoyer" aria-label="Envoyer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
    <details class="conv-options">
      <summary class="conv-options-summary">
        <span class="conv-options-caret" aria-hidden="true">▸</span>
        <span class="conv-options-label">Options</span>
      </summary>
      <div class="conv-agent-bar">
      <button id="conv-agent-toggle" class="conv-agent-toggle" type="button"
        aria-expanded="false" aria-controls="conv-agent-panel">
        <span class="conv-agent-caret" aria-hidden="true">▸</span>
        <span class="conv-agent-toggle-label">Type d'agent :</span>
        <span id="conv-agent-value" class="conv-agent-toggle-value">…</span>
      </button>
      <div id="conv-agent-panel" class="conv-agent-panel" role="radiogroup"
        aria-label="Type d'agent" hidden></div>
      <button id="conv-project-toggle" class="conv-agent-toggle" type="button"
        aria-expanded="false" aria-controls="conv-project-panel">
        <span class="conv-agent-caret" aria-hidden="true">▸</span>
        <span class="conv-agent-toggle-label">Projet :</span>
        <span id="conv-project-value" class="conv-agent-toggle-value">à choisir</span>
      </button>
      <div id="conv-project-panel" class="conv-agent-panel" role="radiogroup"
        aria-label="Projet" hidden></div>
      <div id="conv-project-suggestions" class="conv-project-suggestions" hidden></div>
      <button id="conv-isolation-toggle" class="conv-agent-toggle" type="button"
        aria-expanded="false" aria-controls="conv-isolation-panel">
        <span class="conv-agent-caret" aria-hidden="true">▸</span>
        <span class="conv-agent-toggle-label">Environnement :</span>
        <span id="conv-isolation-value" class="conv-agent-toggle-value">shared</span>
      </button>
      <div id="conv-isolation-panel" class="conv-agent-panel" role="radiogroup"
        aria-label="Environnement" hidden></div>
      </div>
    </details>
    <div id="conv-new-error" class="conv-new-error"></div>
    <div id="conv-tabs" class="conv-tabs"></div>
    <div id="conv-panels" class="conv-panels">
      <p class="muted conv-empty">Sélectionne une conversation à gauche, ou lance-en une nouvelle ci-dessus.</p>
    </div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script type="module" src="/static/js/conversations.js"></script>
{% endblock %}
