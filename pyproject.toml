[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bouzecode"
version = "1.1.1"
description = "Bouzecode: A Fast, Hackable Python AI Coding Assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "markdown>=3.10.2",
    "flask>=3.0",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "prompt-toolkit>=3.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    # RunPythonTest and the folder-description analyzer both import tqdm at use
    # time. It used to arrive only as a transitive dependency of `openai`, so a
    # resolver that dropped it left the progress bar silently absent.
    "tqdm>=4.60",
]

[project.optional-dependencies]
voice    = ["sounddevice"]
vision   = ["Pillow"]
# No `telegram` extra: the /telegram bridge (backend/commands/telegram_cmd.py)
# talks to the Bot API over urllib and imports no third-party client.
web      = ["flask>=3.0", "psutil>=5.9", "pyyaml>=6.0"]
# pytest-timeout is not optional: tests/backend/multi_agent/test_terminal_subagent.py
# carries a @pytest.mark.timeout(90), which pytest reports as an unknown mark (and
# silently does NOT enforce) when the plugin is absent.
test     = ["pytest", "pytest-xdist", "pytest-playwright", "pytest-timeout"]

[project.scripts]
bouzecode = "bouzecode:main"
bouzegui = "bouzecode.web_v2.app:main"

[tool.setuptools]
py-modules = [
    "cloudsave",
    "compaction",
    "config",
    "context_gc",
    "tool_registry",
]

[tool.setuptools.packages.find]
where = ["src", "."]
# "src*" / "build*": scanning "." re-discovers the src/ layout (and any stale
# build/ tree) under a second, bogus name, shipping every module twice.
#
# "*.tests" / "*.tests.*": test trees living UNDER a shipped package. `tests*`
# alone only matches the TOP-LEVEL `tests`, so the wheel carried 152 test files
# (all of bouzecode.web_v2.tests, bouzecode.web_v2.runtime.tests, readme_sync.tests,
# …) — and `namespaces = true`, the default here, means a test directory did not
# even need an __init__.py to be picked up. Nothing imports them at runtime. The
# single module named `test_*` that legitimately ships is
# bouzecode/backend/tools/ops/test_runner.py: it IS the RunPythonTest tool.
# Guarded by tests/backend/regression/structure/test_packaging_declarations.py,
# which also refuses a stray test module left inside a production package —
# excluding packages cannot drop a single file.
exclude = ["tests*", "docs*", "src*", "build*", "*.tests", "*.tests.*"]

# Non-Python payload shipped inside the wheel.
#
# system_prompts/ sits beside the package (src/system_prompts), not inside it, so
# the scan above only reaches it because it carries an __init__.py — it therefore
# installs as a top-level `system_prompts` package. That is exactly the second
# location probed by _resolve_prompts_dir() in backend/core/_embedded_data.py
# (<site-packages>/system_prompts), so wheel and editable installs both resolve.
# Declaring package-dir instead would break the dual src/+root package roots.
[tool.setuptools.package-data]
"system_prompts" = ["*.txt", "*.md"]
"bouzecode.backend" = ["data/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
# --import-mode=importlib is NOT a style preference — do not drop it.
# The repo root holds flat packages (tools/, commands/, plugin/, ui/, memory/…)
# whose names are reused by directories under tests/. In the default "prepend"
# mode pytest puts a test file's package root on sys.path[0], which makes
# `import tools` resolve to tests/backend/tools for the rest of the session:
# same file, different result depending on collection order. importlib mode adds
# nothing to sys.path, and the unbroken __init__.py chain under tests/ (enforced
# by tests/backend/regression/structure/test_test_packages_are_complete.py) gives
# every test module a fully-qualified name that can collide with nothing.
addopts = "--import-mode=importlib"
# `readme_sync/` is a dev tool that lives outside src/ and ships its own suite.
# It is listed here on purpose: while `testpaths` was `tests` alone, those 44 tests
# were never collected and two of them rotted unnoticed for the whole life of the
# navigation-protocol rewrite. Its __init__.py chain is unbroken up to the repo
# root, so its module names stay fully qualified and collide with nothing.
#
# The four trees under src/ are here for the same reason, and the same rot was
# waiting in them: test_wire_dump_exactness.py had been raising KeyError since the
# payload journal went delta-encoded, and nothing said so. Every one of them carries
# an unbroken __init__.py chain up to `src/`, which is a sys.path root (see
# `pythonpath` above), so their module names are fully qualified — enforced by
# tests/backend/regression/structure/test_test_packages_are_complete.py, which reads
# THIS list. Collecting them does not ship them: see `packages.find.exclude` above.
testpaths = [
    "tests",
    "readme_sync/tests",
    "src/bouzecode/backend/tests",
    "src/bouzecode/backend/agent/providers/backends/tests",
    "src/bouzecode/web_v2/runtime/tests",
    "src/bouzecode/web_v2/tests",
]
markers = [
    "backend: agent-engine tests",
    "ui: terminal-UI tests",
    "web: Flask web-UI tests (tests/web_v2/, src/bouzecode/web_v2/tests/)",
    "slow: fixture-target marker",
    "llm: needs a live LLM gateway; self-skips without credentials",
]
