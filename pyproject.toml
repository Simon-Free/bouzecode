[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bouzecode"
version = "1.1.1"
description = "Bouzecode: A Fast, Hackable Python AI Coding Assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "markdown>=3.10.2",
    "flask>=3.0",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "prompt-toolkit>=3.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
]

[project.optional-dependencies]
voice    = ["sounddevice"]
vision   = ["Pillow"]
# No `telegram` extra: the /telegram bridge (backend/commands/telegram_cmd.py)
# talks to the Bot API over urllib and imports no third-party client.
web      = ["flask>=3.0", "psutil>=5.9", "pyyaml>=6.0"]
test     = ["pytest", "pytest-xdist", "pytest-playwright"]

[project.scripts]
bouzecode = "bouzecode:main"
bouzegui = "bouzecode.web_v2.app:main"

[tool.setuptools]
py-modules = [
    "cloudsave",
    "compaction",
    "config",
    "context_gc",
    "tool_registry",
]

[tool.setuptools.packages.find]
where = ["src", "."]
# "src*" / "build*": scanning "." re-discovers the src/ layout (and any stale
# build/ tree) under a second, bogus name, shipping every module twice.
exclude = ["tests*", "docs*", "src*", "build*"]

# Non-Python payload shipped inside the wheel.
#
# system_prompts/ sits beside the package (src/system_prompts), not inside it, so
# the scan above only reaches it because it carries an __init__.py — it therefore
# installs as a top-level `system_prompts` package. That is exactly the second
# location probed by _resolve_prompts_dir() in backend/core/_embedded_data.py
# (<site-packages>/system_prompts), so wheel and editable installs both resolve.
# Declaring package-dir instead would break the dual src/+root package roots.
[tool.setuptools.package-data]
"system_prompts" = ["*.txt", "*.md"]
"bouzecode.backend" = ["data/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
# --import-mode=importlib is NOT a style preference — do not drop it.
# The repo root holds flat packages (tools/, commands/, plugin/, ui/, memory/…)
# whose names are reused by directories under tests/. In the default "prepend"
# mode pytest puts a test file's package root on sys.path[0], which makes
# `import tools` resolve to tests/backend/tools for the rest of the session:
# same file, different result depending on collection order. importlib mode adds
# nothing to sys.path, and the unbroken __init__.py chain under tests/ (enforced
# by tests/backend/regression/structure/test_test_packages_are_complete.py) gives
# every test module a fully-qualified name that can collide with nothing.
addopts = "--import-mode=importlib"
testpaths = ["tests"]
markers = [
    "backend: agent-engine tests",
    "ui: terminal-UI tests",
    "web: Flask web-UI tests (tests/web_v2/, src/bouzecode/web_v2/tests/)",
    "slow: fixture-target marker",
]
