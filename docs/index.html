<script>
(function () {
  const decode = b64 => new TextDecoder("utf-8").decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
  const cache = {};
  const html = lang => cache[lang] || (cache[lang] = decode(document.getElementById("src-" + lang).textContent.trim()));
  const frame = document.getElementById("page");
  const buttons = document.querySelectorAll("#lang-toggle button");
  function pick() {
    const q = new URLSearchParams(location.search).get("lang") || location.hash.replace("#", "");
    if (q === "fr" || q === "en") return q;
    const saved = localStorage.getItem("bouzecode-lang");
    if (saved === "fr" || saved === "en") return saved;
    return (navigator.language || "en").toLowerCase().startsWith("fr") ? "fr" : "en";
  }
  function show(lang) {
    frame.srcdoc = html(lang);
    document.documentElement.lang = lang;
    buttons.forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
    try { localStorage.setItem("bouzecode-lang", lang); } catch (e) {}
    history.replaceState(null, "", location.pathname + location.search.replace(/[?&]lang=\w+/, "") + "#" + lang);
    window.__lang = lang;
  }
  buttons.forEach(b => b.onclick = () => { if (b.dataset.lang !== window.__lang) show(b.dataset.lang); });
  show(pick());
})();
</script>
